services:
  mysql:
    image: mysql:8.4
    container_name: meritcoin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meritcoin
      MYSQL_USER: meritcoin
      MYSQL_PASSWORD: meritcoin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: meritcoin-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  mysql_data:
