server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/meritcoin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USER:meritcoin}
    password: ${DATABASE_PASSWORD:meritcoin}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
app:
  admin:
    email: ${ADMIN_EMAIL:admin@meritcoin.local}
    password: ${ADMIN_PASSWORD:admin123}
  mail:
    from: ${MAIL_FROM:no-reply@meritcoin.local}
    brevo-key: ${BREVO_API_KEY:}
